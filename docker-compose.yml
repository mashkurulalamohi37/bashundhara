version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: bashundhara-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-bashundhara_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bashundhara-fastapi-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - POSTGRES_DB=${POSTGRES_DB:-bashundhara_db}
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-bashundhara_secret_key_2026_super_secure}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      - db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bashundhara-community-platform
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

